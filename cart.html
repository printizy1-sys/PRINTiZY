<!DOCTYPE html>
<html>

<head>

<title>My Cart</title>


<style>


body{

font-family:Arial;
padding:20px;
background:#f5f5f5;

}


.cart-container{

max-width:800px;
margin:auto;

}



.cart-card{

background:white;
padding:20px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);

display:flex;
gap:20px;

}



.cart-card img{

width:100px;
height:100px;
object-fit:cover;
border-radius:10px;

}



.cart-info{

flex:1;

}


.price{

font-size:18px;
font-weight:bold;
color:#009688;

}


.remove{

background:red;
color:white;
border:none;
padding:8px 15px;
border-radius:5px;
cursor:pointer;

}


.total-box{

background:white;
padding:20px;
border-radius:15px;
font-size:22px;
font-weight:bold;

}



.checkout-btn{

width:100%;
margin-top:20px;
padding:15px;

background:#FF6B00;
color:white;

border:none;
border-radius:10px;

font-size:18px;

cursor:pointer;

}


</style>

</head>


<body>



<div class="cart-container">


<h1>
My Cart
</h1>


<div id="cartItems">

</div>



<div class="total-box">

Total:
₹<span id="cartTotal">0</span>

</div>



<button 
class="checkout-btn"
onclick="goCheckout()">

Proceed To Checkout

</button>



</div>





<script>


let cart =
JSON.parse(
localStorage.getItem("cart")
)
||
[];



function loadCart(){


const box =
document.getElementById("cartItems");



if(cart.length===0){


box.innerHTML =
"<h3>Cart Empty</h3>";

return;

}



let total = 0;



box.innerHTML =

cart.map((item,index)=>{


total += Number(item.price);



return `


<div class="cart-card">


<img src="${
item.design || 'images/no-image.webp'
}">



<div class="cart-info">


<h3>

${item.productName}

</h3>



<p>

Category:
${item.category}

</p>



<p>

Quantity:
${item.quantity}

</p>



<p class="price">

₹${item.price}

</p>




<button 
class="remove"
onclick="removeCart(${index})">

Remove

</button>



</div>


</div>


`;


}).join("");



document.getElementById(
"cartTotal"
).innerHTML = total;



}




function removeCart(index){


cart.splice(index,1);



localStorage.setItem(
"cart",
JSON.stringify(cart)
);



loadCart();


}





function goCheckout(){


if(cart.length===0){

alert("Cart Empty");

return;

}



location.href="checkout.html";


}



loadCart();


</script>



</body>

</html>
