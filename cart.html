<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0A1F44">
    <title>My Cart | PRINTiZY</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            margin: 0;
            background: #f5f5f5;
            color: #0A1F44;
        }

        .cart-container {
            max-width: 800px;
            margin: auto;
        }

        h1 {
            margin-bottom: 22px;
        }

        .cart-card {
            background: white;
            padding: 16px;
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .cart-card img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
            background: #f1f1f1;
        }

        .cart-info {
            flex: 1;
            min-width: 0;
        }

        .cart-info h3 {
            margin: 0 0 10px;
            overflow-wrap: anywhere;
        }

        .cart-info p {
            margin: 7px 0;
            overflow-wrap: anywhere;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            color: #009688;
        }

        .remove {
            background: #e53935;
            color: white;
            border: none;
            padding: 9px 15px;
            border-radius: 7px;
            cursor: pointer;
        }

        .total-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .checkout-btn {
            width: 100%;
            margin-top: 20px;
            padding: 16px;
            background: #FF6B00;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .checkout-btn:hover {
            background: #e85f00;
        }

        .empty-cart {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        /* Delivery Popup */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .delivery-modal {
            position: relative;
            background: white;
            width: 100%;
            max-width: 460px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            border-radius: 17px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.25);
        }

        .delivery-modal h2 {
            margin: 0 35px 8px 0;
            color: #0A1F44;
        }

        .modal-subtitle {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .close-modal {
            position: absolute;
            top: 12px;
            right: 14px;
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: #f1f1f1;
            font-size: 25px;
            cursor: pointer;
        }

        .delivery-modal label {
            display: block;
            margin-top: 12px;
            font-size: 14px;
            font-weight: bold;
        }

        .delivery-modal input,
        .delivery-modal textarea {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #d8dce3;
            border-radius: 8px;
            outline: none;
            font-family: inherit;
            font-size: 15px;
            background: white;
        }

        .delivery-modal input:focus,
        .delivery-modal textarea:focus {
            border-color: #6F2DBD;
            box-shadow: 0 0 0 2px rgba(111, 45, 189, 0.1);
        }

        .delivery-modal textarea {
            min-height: 80px;
            resize: vertical;
        }

        .order-summary {
            background: #f5f7fb;
            border-radius: 10px;
            padding: 13px;
            margin: 18px 0;
            font-size: 14px;
            line-height: 1.7;
        }

        .summary-total {
            color: #009688;
            font-size: 19px;
            font-weight: bold;
        }

        .send-whatsapp {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #25D366;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .send-whatsapp:hover {
            background: #1fb956;
        }

        .whatsapp-note {
            color: #666;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
            margin-bottom: 0;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .cart-card {
                padding: 12px;
                gap: 12px;
            }

            .cart-card img {
                width: 82px;
                height: 82px;
            }

            .cart-info h3 {
                font-size: 16px;
            }

            .total-box {
                padding: 16px;
                font-size: 20px;
            }

            .checkout-btn {
                font-size: 16px;
            }

            .delivery-modal {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="cart-container">

    <h1>My Cart</h1>

    <div id="cartItems"></div>

    <div class="total-box">
        Total: ₹<span id="cartTotal">0</span>
    </div>

    <button
        type="button"
        class="checkout-btn"
        onclick="goCheckout()">
        Proceed To Checkout
    </button>

</div>

<!-- Delivery Address Popup -->
<div
    class="modal-overlay"
    id="deliveryModal"
    aria-hidden="true">

    <div
        class="delivery-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="deliveryTitle">

        <button
            type="button"
            class="close-modal"
            onclick="closeDeliveryModal()"
            aria-label="Close">
            &times;
        </button>

        <h2 id="deliveryTitle">Delivery Details</h2>

        <p class="modal-subtitle">
            Please enter your details to place your order on WhatsApp.
        </p>

        <form id="deliveryForm">

            <label for="customerName">Full Name *</label>
            <input
                type="text"
                id="customerName"
                placeholder="Enter your full name"
                autocomplete="name"
                required>

            <label for="customerPhone">Mobile Number *</label>
            <input
                type="tel"
                id="customerPhone"
                placeholder="10-digit mobile number"
                inputmode="numeric"
                autocomplete="tel-national"
                pattern="[0-9]{10}"
                maxlength="10"
                required>

            <label for="customerAddress">Full Delivery Address *</label>
            <textarea
                id="customerAddress"
                placeholder="House number, street, area, landmark"
                autocomplete="street-address"
                required></textarea>

            <label for="customerCity">City / State *</label>
            <input
                type="text"
                id="customerCity"
                placeholder="Enter city and state"
                autocomplete="address-level2"
                required>

            <label for="customerPincode">PIN Code *</label>
            <input
                type="text"
                id="customerPincode"
                placeholder="6-digit PIN code"
                inputmode="numeric"
                pattern="[0-9]{6}"
                maxlength="6"
                autocomplete="postal-code"
                required>

            <div class="order-summary" id="checkoutSummary"></div>

            <button type="submit" class="send-whatsapp">
                Send Order on WhatsApp
            </button>

            <p class="whatsapp-note">
                WhatsApp will open with your order details.
                Please press Send in WhatsApp to submit your order.
            </p>

        </form>
    </div>
</div>

<script>
    let cart = [];

    try {
        const savedCart = JSON.parse(localStorage.getItem("cart") || "[]");
        cart = Array.isArray(savedCart) ? savedCart : [];
    } catch (error) {
        cart = [];
    }

    function getItemPrice(item) {
        const price = Number(item.price);
        return Number.isFinite(price) && price > 0 ? price : 0;
    }

    function getTotal() {
        return cart.reduce((sum, item) => sum + getItemPrice(item), 0);
    }

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, function(char) {
            const entities = {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            };
            return entities[char];
        });
    }

    function loadCart() {
        const box = document.getElementById("cartItems");
        const totalElement = document.getElementById("cartTotal");

        if (cart.length === 0) {
            box.innerHTML = '<div class="empty-cart"><h3>Cart Empty</h3><p>Add products to your cart to continue.</p></div>';
            totalElement.textContent = "0";
            return;
        }

        box.innerHTML = cart.map((item, index) => {
            const image = escapeHTML(item.design || "images/no-image.webp");
            const name = escapeHTML(item.productName || "Product");
            const category = escapeHTML(item.category || "N/A");
            const quantity = escapeHTML(item.quantity || 1);
            const price = getItemPrice(item);

            return `
                <div class="cart-card">
                    <img
                        src="${image}"
                        alt="${name}"
                        onerror="this.onerror=null;this.src='images/no-image.webp';">

                    <div class="cart-info">
                        <h3>${name}</h3>
                        <p>Category: ${category}</p>
                        <p>Quantity: ${quantity}</p>
                        <p class="price">₹${price.toFixed(2)}</p>

                        <button
                            type="button"
                            class="remove"
                            onclick="removeCart(${index})">
                            Remove
                        </button>
                    </div>
                </div>
            `;
        }).join("");

        totalElement.textContent = getTotal().toFixed(2);
    }

    function removeCart(index) {
        if (index < 0 || index >= cart.length) return;

        cart.splice(index, 1);
        localStorage.setItem("cart", JSON.stringify(cart));
        loadCart();
    }

    function goCheckout() {
        if (cart.length === 0) {
            alert("Your cart is empty.");
            return;
        }

        updateCheckoutSummary();

        const modal = document.getElementById("deliveryModal");
        modal.classList.add("active");
        modal.setAttribute("aria-hidden", "false");

        document.getElementById("customerName").focus();
    }

    function closeDeliveryModal() {
        const modal = document.getElementById("deliveryModal");
        modal.classList.remove("active");
        modal.setAttribute("aria-hidden", "true");
    }

    function updateCheckoutSummary() {
        const total = getTotal();

        const itemsHTML = cart.map(item => {
            const name = escapeHTML(item.productName || "Product");
            const quantity = escapeHTML(item.quantity || 1);
            const price = getItemPrice(item);

            return `<div>${name} × ${quantity} — ₹${price.toFixed(2)}</div>`;
        }).join("");

        document.getElementById("checkoutSummary").innerHTML = `
            <strong>Order Summary</strong>
            ${itemsHTML}
            <hr>
            <div class="summary-total">Total: ₹${total.toFixed(2)}</div>
        `;
    }

    document.getElementById("deliveryModal").addEventListener("click", function(event) {
        if (event.target === this) {
            closeDeliveryModal();
        }
    });

    document.addEventListener("keydown", function(event) {
        if (event.key === "Escape") {
            closeDeliveryModal();
        }
    });

    document.getElementById("deliveryForm").addEventListener("submit", function(event) {
        event.preventDefault();

        if (cart.length === 0) {
            alert("Your cart is empty.");
            closeDeliveryModal();
            loadCart();
            return;
        }

        const name = document.getElementById("customerName").value.trim();
        const phone = document.getElementById("customerPhone").value.trim();
        const address = document.getElementById("customerAddress").value.trim();
        const city = document.getElementById("customerCity").value.trim();
        const pincode = document.getElementById("customerPincode").value.trim();

        if (!/^[0-9]{10}$/.test(phone)) {
            alert("Please enter a valid 10-digit mobile number.");
            return;
        }

        if (!/^[0-9]{6}$/.test(pincode)) {
            alert("Please enter a valid 6-digit PIN code.");
            return;
        }

        const total = getTotal();

        let message = "PRINTiZY - NEW ORDER\n\n";

        message += "CUSTOMER DETAILS\n";
        message += "Name: " + name + "\n";
        message += "Phone: " + phone + "\n";
        message += "Address: " + address + "\n";
        message += "City/State: " + city + "\n";
        message += "PIN Code: " + pincode + "\n\n";

        message += "ORDER DETAILS\n";

        cart.forEach((item, index) => {
            message += "\n" + (index + 1) + ". " + (item.productName || "Product") + "\n";
            message += "Category: " + (item.category || "N/A") + "\n";
            message += "Quantity: " + (item.quantity || 1) + "\n";
            message += "Price: ₹" + getItemPrice(item).toFixed(2) + "\n";
        });

        message += "\nTOTAL: ₹" + total.toFixed(2);
        message += "\n\nPlease confirm my order.";

        // PRINTiZY WhatsApp number, country code included.
        const whatsappNumber = "919920978766";

        const whatsappURL =
            "https://wa.me/" + whatsappNumber +
            "?text=" + encodeURIComponent(message);

        // Open WhatsApp without redirecting to checkout.html.
        const whatsappWindow = window.open(whatsappURL, "_blank");

        if (!whatsappWindow) {
            // Fallback for browsers that block opening a new tab.
            window.location.href = whatsappURL;
        }
    });

    loadCart();
</script>

</body>
</html>
