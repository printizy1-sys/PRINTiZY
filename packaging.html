<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRINTiZY | Custom packaging Printing</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link rel="stylesheet" href="css/common.css">
  
</head>

<body>

<!--==========================
HEADER
===========================-->

<header class="header">

<div class="header-left">

<a href="retailer.html">

<img src="images/categories/logo.webp"
class="logo">

</a>

</div>


<div class="search-box">

<i class="bi bi-search"></i>

<input
type="text"
placeholder="Search T-Shirts, Hoodies, Caps..."
id="searchInput">

</div>


<div class="header-right">



<a href="cart.html" class="icon-btn cart-btn">

<i class="bi bi-cart3"></i>

<span id="cartBadge">0</span>

</a>



</div>

</header>



<!--==========================
BANNER
===========================-->

<section class="hero">

<div class="hero-slider">

<img src="images/packaging/la.webp">



</div>

</section>



<!--==========================
TITLE
===========================-->

<section class="intro">

<h1>

Labels & Packaging

</h1>

<p>

Custom labels and packaging for every business.

</p>

</section>

<section class="top-categories">

<h2>

Shop by Packaging

</h2>

<div class="category-scroll">

<div class="category-card">
<img src="images/packaging/labels.webp">
<p>Labels</p>
</div>

<div class="category-card">
<img src="images/packaging/boxes.webp">
<p>Boxes</p>
</div>

<div class="category-card">
<img src="images/packaging/pouches.webp">
<p>Pouches</p>
</div>

<div class="category-card">
<img src="images/packaging/stickers.webp">
<p>Packaging Stickers</p>
</div>

</div>

</section>

<section class="best-selling">

<h2>BEST SELLERS</h2>

<div class="products-grid" id="allProducts"></div>

</section>

<div id="loader" class="loader">

Loading Products...

</div>



<!--==========================
ALL PRODUCTS
===========================-->






<script>
       const API = "https://printizyserver.onrender.com";

let page = 1;
let loading = false;
let hasMore = true;
let allProducts = [];

/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts() {

    if (loading || !hasMore) return;

    loading = true;

    const loader = document.getElementById("loader");
    const topLoader = document.getElementById("topLoader");

    if (loader) loader.style.display = "block";

    if (topLoader) {
        topLoader.style.display = "block";
        topLoader.style.width = "30%";
    }

    try {

        const res = await fetch(
            `${API}/api/products/all?page=${page}&category=visiting%20cards`,
            {
                cache: "no-store"
            }
        );

        if (topLoader) topLoader.style.width = "70%";

        const data = await res.json();

        if (!data.success) return;

        allProducts.push(...data.products);

        renderProducts(allProducts);

        // ✅ Page show after products loaded
        document.getElementById("mainPage").style.display = "block";

        page++;

        hasMore = data.hasMore;

    } catch (err) {

        console.error(err);

        // API fail ho to bhi page show ho
        document.getElementById("mainPage").style.display = "block";

    } finally {

        loading = false;

        if (loader) loader.style.display = "none";

        if (topLoader) {

            topLoader.style.width = "100%";

            setTimeout(() => {

                topLoader.style.display = "none";
                topLoader.style.width = "0%";

            }, 200);

        }

    }

   }
   
/* =========================
   RENDER PRODUCTS
========================= */

function renderProducts(products) {

    const containers = {
        "best sellers": document.getElementById("roundNeckProducts"),
        "looking for something beyond the usual?": document.getElementById("poloProducts"),
        "shop by card shape": document.getElementById("fullSleeveProducts"),
        "business stationery combo": document.getElementById("hoodiesProducts")
    };

    // Clear all containers
    Object.values(containers).forEach(container => {
        if (container) container.innerHTML = "";
    });

    products.forEach(product => {

        const key = String(product.subCategory || "")
            .trim()
            .replace(/\s+/g, " ")
            .toLowerCase();

        const container = containers[key];

        if (!container) return;

        const img = product.images?.[0] || "images/no-image.webp";
        const price = Number(product.price || 0);
        const quantity = product.quantity || 100;
        const unit = product.unit || "Pieces";

        container.innerHTML += `

<div class="product-card" onclick="openProduct('${product._id}')">

    <img
        src="${img}"
        class="product-image"
        loading="lazy"
        alt="${product.productName}">

    <div class="product-info">

        <div class="product-title">
            ${product.productName}
        </div>

        <div class="product-price2">
    <span class="price">₹${price}</span>
    <span class="text">
        each for ${quantity}<br>${unit.toLowerCase()}
    </span>
</div>
    </div>

</div>

`;
       });

}

/* =========================
   BANNER AUTO SLIDER
========================= */

let bannerIndex = 0;

setInterval(()=>{

const slider =
document.querySelector(".hero-slider");

if(!slider) return;

const banners =
slider.querySelectorAll("img");

bannerIndex++;

if(bannerIndex>=banners.length){

bannerIndex=0;

}

slider.scrollTo({

left:banners[bannerIndex].offsetLeft,

behavior:"smooth"

});

},3000);

/* =========================
   OPEN PRODUCT
========================= */

function openProduct(id){

window.location.href=
`product-details.html?id=${id}`;

}

/* =========================
   FIRST LOAD
========================= */

window.onload=()=>{

loadProducts();

};
   /* ===========================
   LIVE SEARCH
=========================== */

const searchInput = document.getElementById("searchInput");

if (searchInput) {

    searchInput.addEventListener("input", function () {

        const keyword = this.value.toLowerCase().trim();

        if (keyword === "") {
            renderProducts(allProducts);
            return;
        }

        const filtered = allProducts.filter(product => {

            return (
                (product.productName || "").toLowerCase().includes(keyword) ||
                (product.category || "").toLowerCase().includes(keyword)
            );

        });

        renderProducts(filtered);

    });

}


/* ===========================
   CATEGORY FILTER
=========================== */

document.querySelectorAll(".category-card").forEach(card => {

    card.addEventListener("click", function () {

        const category = this.innerText.toLowerCase().trim();

        const filtered = allProducts.filter(product => {

            return (product.category || "")
                .toLowerCase()
                .includes(category);

        });

        renderProducts(filtered);

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    });

});


/* ===========================
   ADD TO CART
=========================== */

function addToCart(product){

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    const index = cart.findIndex(item => item._id === product._id);

    if(index > -1){

        cart[index].qty++;

    }else{

        product.qty = 1;

        cart.push(product);

    }

    localStorage.setItem("cart",JSON.stringify(cart));

    updateCartBadge();

    alert("✅ Added to Cart");

}


/* ===========================
   CART BADGE
=========================== */

function updateCartBadge(){

    const cart = JSON.parse(localStorage.getItem("cart")) || [];

    let total = 0;

    cart.forEach(item=>{

        total += item.qty || 1;

    });

    const badge = document.getElementById("cartBadge");

    if(badge){

        badge.innerText = total;

    }

}


/* ===========================
   WISHLIST
=========================== */

function addToWishlist(product){

    let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

    const exists = wishlist.find(item => item._id === product._id);

    if(exists){

        alert("Already in Wishlist");

        return;

    }

    wishlist.push(product);

    localStorage.setItem("wishlist",JSON.stringify(wishlist));

    alert("❤️ Added to Wishlist");

}


/* ===========================
   OPEN CART
=========================== */

function openCart(){

    window.location.href="cart.html";

}


/* ===========================
   OPEN WISHLIST
=========================== */

function openWishlist(){

    window.location.href="wishlist.html";

}


/* ===========================
   PAGE LOAD
=========================== */

window.addEventListener("load",()=>{

    updateCartBadge();

});
   /* ===========================
   INFINITE SCROLL
=========================== */

window.addEventListener("scroll", () => {

    if (
        window.innerHeight + window.scrollY >=
        document.body.offsetHeight - 300
    ) {

        loadProducts();

    }

});


/* ===========================
   PRODUCT DETAILS
=========================== */

function openProduct(id){

    window.location.href =
    `product.html?id=${id}`;

}


/* ===========================
   BUY NOW
=========================== */

function buyNow(product){

    localStorage.setItem(
        "buyNowProduct",
        JSON.stringify(product)
    );

    window.location.href="checkout.html";

}


/* ===========================
   OPEN EXTERNAL PRODUCT
=========================== */

function openExternalProduct(url){

    if(!url) return;

    window.open(url,"_blank");

}


/* ===========================
   FILTER BY CATEGORY
=========================== */

function filterCategory(category){

    category = category.toLowerCase();

    const filtered = allProducts.filter(p=>{

        return (
            p.category || ""
        ).toLowerCase() === category;

    });

    renderProducts(filtered);

}


/* ===========================
   SORT LOW TO HIGH
=========================== */

function sortPriceLow(){

    const data = [...allProducts];

    data.sort((a,b)=>
        Number(a.price)-Number(b.price)
    );

    renderProducts(data);

}


/* ===========================
   SORT HIGH TO LOW
=========================== */

function sortPriceHigh(){

    const data = [...allProducts];

    data.sort((a,b)=>
        Number(b.price)-Number(a.price)
    );

    renderProducts(data);

}


/* ===========================
   REFRESH PRODUCTS
=========================== */

async function refreshProducts(){

    page = 1;

    hasMore = true;

    allProducts = [];

    document.getElementById("allProducts").innerHTML="";

    await loadProducts();

}


/* ===========================
   IMAGE ERROR
=========================== */

document.addEventListener("error",function(e){

    if(e.target.tagName==="IMG"){

        e.target.src="images/no-image.webp";

    }

},true);


/* ===========================
   PAGE READY
=========================== */

document.addEventListener("DOMContentLoaded",()=>{

    updateCartBadge();

    loadProducts();

});


/* ===========================
   UTILITIES
=========================== */

function formatPrice(price){

    return "₹"+Number(price).toLocaleString("en-IN");

}

function showLoader(){

    const loader=document.getElementById("loader");

    if(loader) loader.style.display="block";

}

function hideLoader(){

    const loader=document.getElementById("loader");

    if(loader) loader.style.display="none";

}
    </script>
</body>
</html>
